[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[tool.uv]
dev-dependencies = [
    "archspec",
]

[project]
name = "x86_64-variant-provider"
authors = [{name = "Michał Górny", email = "mgorny@quansight.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version", "description"]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
]

[project.urls]
Home = "https://github.com/wheelnext/x86_64-variant-provider/"

[project.entry-points.variant_plugins]
x86_64 = "x86_64_variant_provider"
